{% extends 'base.html' %}

{% block titulo %}{{ titulo }} - Controle de Gastos{% endblock %}

{% block conteudo %}

<div class="cabecalho-pagina">
  <h1>{{ titulo }}</h1>
</div>

<div class="card">
  <form method="post" novalidate>
    {% csrf_token %}

    {% include 'gastos/_form_campos.html' %}

    <div class="acoes-form">
      <button type="submit" class="botao botao-primario">Salvar</button>
      <a class="botao" href="{% url 'gastos:categoria_lista' %}">Cancelar</a>
    </div>
  </form>
</div>

{% endblock %}
